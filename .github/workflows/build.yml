name: Build QR Code Generator EXE

# Wann soll das passieren? Immer wenn ein Tag gepusht wird, der mit 'v' beginnt (z.B. v1.0)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Oder Ihre bevorzugte Version

    - name: Abhängigkeiten installieren
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: EXE bauen
      # Hier wird der PyInstaller Befehl ausgeführt
      run: pyinstaller --noconsole --onefile --name "QRCodeGen" qr_generator.py

    - name: Release erstellen und EXE hochladen
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/QRCodeGen.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}